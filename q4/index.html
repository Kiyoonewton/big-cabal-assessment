<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BCM responsive layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout" aria-label="Layout demonstration">
      <section class="panel a">
        <h1>
          A long heading that should wrap safely
          SuperLongWordWithoutAnySpacesToTestOverflow
        </h1>
      </section>
      <section class="panel d"><h2>D</h2></section>
      <section class="panel b"><h2>B</h2></section>
      <section class="panel c"><h2>C</h2></section>
      <section class="panel g"><h2>G</h2></section>
      <section class="panel e"><h2>E</h2></section>
      <section class="panel f"><h2>F</h2></section>
      <section class="panel h"><h2>H</h2></section>
    </main>
  </body>
</html>
